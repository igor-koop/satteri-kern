[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64", "macos-x64", "windows-x64"]
task.run_auto_install = false

[tools]
node = "24.21.0"
pnpm = "12.5.1"
hk = "2.0.1"
pkl = "0.32.1"
typos = "1.50.2"
betterleaks = "1.8.1"
actionlint = "1.7.12"
pinact = "5.0.0"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]
